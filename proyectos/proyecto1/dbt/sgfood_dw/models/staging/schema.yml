# schema.yml (staging) — documentación y pruebas de la capa staging.
# Regla: staging NO elimina filas; las pruebas de llave son 'warn' cuando la
# fuente puede venir sucia (CSV) y 'error' cuando el OLTP la garantiza.
version: 2

models:
  - name: stg_oltp__sucursal
    description: "Sucursales tipadas. 1 fila por sucursal."
    columns:
      - name: id_sucursal
        tests: [unique, not_null]
  - name: stg_oltp__categoria
    description: "Categorías de producto."
    columns:
      - name: id_categoria
        tests: [unique, not_null]
  - name: stg_oltp__marca
    description: "Marcas."
    columns:
      - name: id_marca
        tests: [unique, not_null]
  - name: stg_oltp__producto
    description: "Productos con bandera dq_precio_negativo."
    columns:
      - name: id_producto
        tests: [unique, not_null]
      - name: precio_lista_estado
        description: "NULO / VACIO / OK (distingue NULL de cadena vacía)."
        tests:
          - accepted_values: {arguments: {values: ['NULO', 'VACIO', 'OK']}}
  - name: stg_oltp__cliente
    description: "Clientes. NULL y vacío en texto se etiquetan distinto (NO_INFORMADO vs SIN_VALOR)."
    columns:
      - name: id_cliente
        tests:
          - unique:   {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
  - name: stg_oltp__venta
    description: "Encabezado de venta; estado en mayúsculas."
    columns:
      - name: id_venta
        tests: [unique, not_null]
      - name: estado
        tests:
          - accepted_values:
              arguments: {values: ['COMPLETADA', 'ANULADA', 'PENDIENTE']}
              config: {severity: warn}
  - name: stg_oltp__venta_detalle
    description: "Líneas de venta con subtotal_calculado y banderas dq_*."
    columns:
      - name: id_detalle
        tests: [unique, not_null]
      - name: id_venta
        tests:
          - relationships: {arguments: {to: ref('stg_oltp__venta'), field: id_venta}}
  - name: stg_csv__inventario_bodega
    description: "Snapshot de inventario con banderas de stock y vencimiento."
    tests:
      - unique_combination_of_columns:
          arguments: {combination_of_columns: [fecha_corte, id_sucursal, id_producto]}
          config: {severity: warn}
  - name: stg_csv__proveedores_precios
    description: "Costos de proveedor; costo_proveedor_estado separa NULO de VACIO."
    columns:
      - name: costo_proveedor_estado
        tests:
          - accepted_values: {arguments: {values: ['NULO', 'VACIO', 'OK']}}
  - name: stg_csv__promociones
    description: "Promociones por categoría."
    columns:
      - name: id_promocion
        tests:
          - unique:   {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
  - name: stg_csv__metas_ventas
    description: "Metas mensuales por sucursal."
  - name: stg_csv__devoluciones
    description: "Devoluciones de producto."
    columns:
      - name: id_devolucion
        tests:
          - unique:   {config: {severity: warn}}
          - not_null: {config: {severity: warn}}
